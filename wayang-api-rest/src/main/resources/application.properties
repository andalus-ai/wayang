quarkus.http.port=8080
# OIDC: set quarkus.oidc.auth-server-url (or public-key) per environment. Tokens must carry
# a tenant claim (wayang.auth.tenant-claim) and groups drawn from VIEWER/OPERATOR/DESIGNER/ADMIN.
quarkus.oidc.application-type=service
quarkus.http.auth.permission.api.paths=/api/*,/ws/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.cors.origins=
# Response headers for every answer (the API returns JSON only; nothing here should be framed, sniffed or cached).
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'
quarkus.grpc.server.use-separate-server=false
quarkus.smallrye-openapi.path=/openapi
%dev.quarkus.http.cors.origins=/.*/

# --- Persistence and engine (see docs/API.md "Deployment") ---
# wayang.store=jdbc                  # memory (default) | jdbc
# wayang.engine=gamelan              # reference (default) | gamelan
# wayang.gamelan.endpoint=http://gamelan:8080
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.jdbc.url=jdbc:postgresql://db/wayang

# --- Identity (see docs/IDENTITY.md) ---
# wayang.auth.mode=jwt               # jwt (default, tenant claim + groups) | numu (Numu identity: PAT/JWT, path-scoped RBAC)
# quarkus.oidc.enabled=false         # required with mode=numu
# quarkus.grpc.clients.numu.host=numu-identity
# quarkus.grpc.clients.numu.port=9000
# wayang.auth.numu.cache-seconds=30  # 0 = no cache (revocation immediate, 2 remote calls per request)

# --- Triggers (see docs/TRIGGERS.md) ---
# Webhooks (/hooks/{tenant}/{id}) are authenticated by the trigger's own secret (header X-Wayang-Secret), outside /api.
quarkus.http.limits.max-body-size=1M
# wayang.triggers.interval=5s

# --- Connected accounts / Gmail (see docs/EMAIL.md) ---
# wayang.oauth.redirect-uri=https://wayang.example.com/oauth/callback   # needs wayang.secrets.key

# --- MCP servers generated from OpenAPI (see docs/MCP.md) ---
# Spec downloads and tool calls use wayang.connectors.http.allow-private / allowed-hosts (the SSRF guard).

# Audit log (GET /api/v1/audit, tenant-wide ADMIN): non-read requests and 401/403 of authenticated callers, stored with wayang.store.
# wayang.audit.memory-entries-per-tenant=5000
# Local tenant kill switch (403 for everything, triggers stop): comma separated, restart to change.
# wayang.tenants.suspended=acme,globex

# EIP steps (claimCheck, collect, idempotent): durable and replica-shared with wayang.store=jdbc (tables wayang_eip_*), memory otherwise.
# wayang.eip.idempotency-retention-days=30
# wayang.eip.collect-retention-days=30

# --- Workspace bundles, configuration, vault (see docs/WORKSPACE.md) ---
# Master keys: exactly one of wayang.secrets.key | wayang.secrets.key-file | wayang.secrets.vault-keyring-path
# wayang.secrets.key-file=/run/secrets/wayang-keyring          # lines: active=<id> and <id>:<base64 of 32 bytes>; chmod 0400
# Cloud secrets (optional, read-only; ${secret:aws.NAME} ${secret:azure.NAME} ${secret:gcp.NAME}): see docs/WORKSPACE.md
# wayang.cloud.aws.region=eu-west-1                              # + wayang.cloud.aws.access-key-id / secret-access-key-file, or AWS_* env
# wayang.cloud.azure.vault-url=https://myvault.vault.azure.net   # + tenant-id, client-id, client-secret-file
# wayang.cloud.gcp.project=my-project                            # + service-account-file
# wayang.cloud.aws.credentials=imds|container   wayang.cloud.azure.auth=managed-identity   wayang.cloud.gcp.auth=metadata   (no key files needed)
# wayang.secrets.file-dir=/run/secrets/wayang                 # ${secret:file.NAME} reads <dir>/<tenant>/NAME (mounted secrets)
# wayang.secrets.archive-enabled=false                         # encrypted secrets archive endpoints (admin); off by default
# wayang.vault.address=https://vault.example.com:8200          # enables ${secret:vault.NAME} and wayang.secrets.vault-keyring-path
# wayang.vault.token-file=/run/secrets/vault-token             # or wayang.vault.approle.role-id + secret-id-file
# wayang.vault.mount=secret
# wayang.vault.base-path=wayang
# wayang.workspace.signing-key-file=/run/secrets/wayang-bundle-key   # exports carry an HMAC; this server only imports signed bundles
# wayang.audit.secret-reads=false      # one audit entry (RESOLVE secret: name, node, run; never a value) per secret a node resolves
