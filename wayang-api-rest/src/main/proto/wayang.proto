syntax = "proto3";

option java_multiple_files = true;
option java_package = "tech.kayys.wayang.grpc";
option java_outer_classname = "WayangProto";

package wayang.v1;

// Documents, variables and payloads travel as JSON text so the contract does not
// have to mirror every BPMN/DMN/EIP schema. Errors use standard gRPC status codes.
service Wayang {
  rpc StartRun(StartRunRequest) returns (JsonReply);
  rpc GetRun(RunRef) returns (JsonReply);
  rpc CancelRun(RunRef) returns (Empty);
  rpc ListTasks(ListRequest) returns (JsonReply);
  rpc CompleteTask(CompleteTaskRequest) returns (Empty);
  rpc SendMessage(MessageRequest) returns (JsonReply);
  // Server stream of run events; empty run_id watches every run of the tenant.
  rpc WatchRuns(WatchRequest) returns (stream JsonReply);
}

message Empty {}
message JsonReply { string json = 1; }
message RunRef { string run_id = 1; }
message ListRequest { int32 limit = 1; }
message StartRunRequest {
  string process_id = 1;
  int32 version = 2;      // 0 = latest published
  string input_json = 3;  // JSON object, may be empty
}
message CompleteTaskRequest {
  string token = 1;
  string outputs_json = 2;
}
message MessageRequest {
  string name = 1;
  string correlation_key = 2;
  string payload_json = 3;
}
message WatchRequest { string run_id = 1; }
