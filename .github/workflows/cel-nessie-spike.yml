name: CEL Nessie qualification spike

on:
  pull_request:
    paths:
      - "spikes/cel-nessie/**"
      - ".github/workflows/cel-nessie-spike.yml"
  push:
    branches:
      - main
    paths:
      - "spikes/cel-nessie/**"
      - ".github/workflows/cel-nessie-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cel-nessie-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Isolated CEL-Java 0.8.0 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spikes/cel-nessie/pom.xml

      - name: Verify isolated CEL spike
        run: mvn -B -ntp -f spikes/cel-nessie/pom.xml clean verify
