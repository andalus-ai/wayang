name: CEL PostgreSQL pressure-event qualification

on:
  pull_request:
    paths:
      - "spikes/cel-nessie/**"
      - ".github/workflows/cel-postgres-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-pressure-event-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wayang_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wayang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WAYANG_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/wayang_test
      WAYANG_TEST_POSTGRES_USER: postgres
      WAYANG_TEST_POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply pressure-event schema migration
        run: psql -h localhost -U postgres -d wayang_test -v ON_ERROR_STOP=1 -f spikes/cel-nessie/src/main/resources/db/migration/V1__pressure_event_store.sql
      - name: Compile qualification harness and resolve test classpath
        run: >-
          mvn -B -f spikes/cel-nessie/pom.xml
          -DskipTests test-compile dependency:build-classpath
          -Dmdep.includeScope=test -Dmdep.outputFile=target/test-classpath.txt
      - name: Seed pending event and active lease
        run: >-
          java -cp "spikes/cel-nessie/target/test-classes:spikes/cel-nessie/target/classes:$(cat spikes/cel-nessie/target/test-classpath.txt)"
          tech.kayys.wayang.spike.PostgresRestartQualification seed
      - name: Create custom-format backup
        run: pg_dump -h localhost -U postgres -d wayang_test --format=custom --no-owner --no-acl --file=pressure-events.dump
      - name: Restore backup into isolated database
        run: |
          createdb -h localhost -U postgres wayang_restore_test
          pg_restore -h localhost -U postgres -d wayang_restore_test --no-owner --no-acl pressure-events.dump
          restored_count="$(psql -h localhost -U postgres -d wayang_restore_test -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM wayang_pressure_event WHERE acknowledged_at IS NULL")"
          test "$restored_count" = "1"
          restored_schema="$(psql -h localhost -U postgres -d wayang_restore_test -At -v ON_ERROR_STOP=1 -c "SELECT schema_version FROM wayang_pressure_event_schema WHERE singleton = TRUE")"
          test "$restored_schema" = "1"
          restored_lease="$(psql -h localhost -U postgres -d wayang_restore_test -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM wayang_pressure_event WHERE consumer_id = 'restart-worker-before' AND claim_token IS NOT NULL AND lease_expires_at IS NOT NULL")"
          test "$restored_lease" = "1"
      - name: Restart PostgreSQL service container
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U postgres -d wayang_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become healthy after restart" >&2
          exit 1
      - name: Recover and acknowledge event after database restart
        run: >-
          java -cp "spikes/cel-nessie/target/test-classes:spikes/cel-nessie/target/classes:$(cat spikes/cel-nessie/target/test-classpath.txt)"
          tech.kayys.wayang.spike.PostgresRestartQualification verify
      - name: Run PostgreSQL-backed store integration tests
        run: mvn -B -f spikes/cel-nessie/pom.xml -Dtest=PostgresPressureEventStoreTest test

  postgres-wal-pitr:
    name: PostgreSQL physical backup and WAL PITR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Qualify physical base backup and point-in-time recovery
        run: bash spikes/cel-nessie/scripts/qualify-postgres-pitr.sh
