name: CEL PostgreSQL pressure-event qualification

on:
  pull_request:
    paths:
      - "spikes/cel-nessie/**"
      - ".github/workflows/cel-postgres-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-pressure-event-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wayang_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wayang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WAYANG_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/wayang_test
      WAYANG_TEST_POSTGRES_USER: postgres
      WAYANG_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify PostgreSQL-backed pressure event store
        run: mvn -B -f spikes/cel-nessie/pom.xml -Dtest=PostgresPressureEventStoreTest test
