# Durable variant of the Community all-in-one: the same container plus PostgreSQL, with WAYANG_STORE=jdbc. UNBUILT/untested (see Dockerfile.all-in-one).
#   export WAYANG_AUTH_LOCAL_API_KEY=$(openssl rand -hex 24)
#   export WAYANG_DB_PASSWORD=$(openssl rand -hex 16)
#   docker compose -f deploy/docker-compose.all-in-one.yml -f deploy/docker-compose.all-in-one.postgres.yml up --build
# Data lives in the named volume `wayang-db`; `docker compose down` keeps it, `down -v` deletes it. The database is not published on the host.
# Tables are created idempotently by JdbcSchema.apply when the jdbc store starts.
services:
  wayang:
    environment:
      WAYANG_STORE: jdbc
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/wayang
      QUARKUS_DATASOURCE_USERNAME: wayang
      QUARKUS_DATASOURCE_PASSWORD: ${WAYANG_DB_PASSWORD:?set WAYANG_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wayang
      POSTGRES_USER: wayang
      POSTGRES_PASSWORD: ${WAYANG_DB_PASSWORD:?set WAYANG_DB_PASSWORD}
    volumes:
      - wayang-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayang -d wayang"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  wayang-db:
